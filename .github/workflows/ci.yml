name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: thinkone, POSTGRES_PASSWORD: thinkone, POSTGRES_DB: thinkone }
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U thinkone" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://thinkone:thinkone@localhost:55433/thinkone_test
          S3_ENDPOINT: ""
      - name: Export OpenAPI (frontend type source)
        run: uv run python -c "import json; from app.api.main import app; print(json.dumps(app.openapi()))" > ../frontend/openapi.json
        env: { APP_ENV: test, S3_ENDPOINT: "" }
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: frontend/openapi.json }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
