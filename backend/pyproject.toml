[project]
name = "thinkone-backend"
version = "0.1.0"
description = "ThinkOne contract platform — API + worker (one package, two entrypoints)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "procrastinate>=2.13",
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "boto3>=1.34",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.0",
    "structlog>=24.1",
    "email-validator>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
