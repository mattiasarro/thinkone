<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>{% block title %}{{ title }}{% endblock %}</title>
<style>
  @page { size: A4; margin: 18mm 18mm 20mm 18mm; @bottom-center { content: "{{ footer or '' }}"; font: 8.5pt "DejaVu Sans", "Helvetica", sans-serif; color: #6b7280; } @bottom-right { content: counter(page) " / " counter(pages); font: 8.5pt "DejaVu Sans", sans-serif; color: #6b7280; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 10.5pt/1.45 "DejaVu Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #141821; }
  .doc { width: 100%; }
  .screen body { background: #e9ebf0; }
  @media screen { body { background: #e9ebf0; padding: 24px 0; } .doc { width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; padding: 18mm; box-shadow: 0 10px 30px -8px rgb(20 26 38 / 0.2); } }
  h1 { font-size: 20pt; margin: 0 0 2pt; letter-spacing: -0.01em; }
  h2 { font-size: 12pt; margin: 18pt 0 6pt; border-bottom: 1px solid #e4e7ee; padding-bottom: 3pt; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16pt; margin-bottom: 14pt; }
  .head .logo img { max-height: 42pt; max-width: 160pt; }
  .brand { font-weight: 700; font-size: 13pt; }
  .meta { font-size: 9.5pt; color: #596170; }
  .muted { color: #596170; }
  .mono { font-family: "DejaVu Sans Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  th, td { text-align: left; padding: 5pt 6pt; border-bottom: 1px solid #e4e7ee; vertical-align: top; }
  th { font-size: 8.5pt; text-transform: uppercase; letter-spacing: 0.04em; color: #596170; font-weight: 600; border-bottom: 1px solid #cdd2da; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 700; border-top: 1px solid #cdd2da; }
  tr.sub td { color: #596170; font-size: 9.5pt; }
  .grid { display: flex; gap: 16pt; }
  .grid > div { flex: 1; }
  .kv { margin: 0; }
  .kv dt { float: left; clear: left; width: 38%; color: #596170; }
  .kv dd { margin: 0 0 3pt 40%; }
  .box { border: 1px solid #e4e7ee; border-radius: 6pt; padding: 8pt 10pt; margin: 6pt 0; }
  .accent { border-left: 3pt solid {{ accent or '#1f5eff' }}; }
  ol.terms { padding-left: 16pt; margin: 4pt 0; }
  ol.terms li { margin: 3pt 0; }
  .note { font-size: 9pt; color: #596170; margin-top: 14pt; }
  .sign { margin-top: 18pt; }
  pre.text { font: inherit; white-space: pre-wrap; margin: 0; }
</style>
</head>
<body><div class="doc">{% block body %}{% endblock %}</div></body>
</html>
