<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThinkOne · Avaleht — 10 kujundusvarianti</title>
  <!-- Iseseisev kujunduslabor: SAMA avalehe sisu kümnes eri iseloomus (palett · kirjatüüp ·
       ikoonikeel · üks liikumishetk). Ei kasuta demo styles.css-i ega andmeid — ainult võrdluseks. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@500;700;800&family=Archivo:wdth,wght@100..125,500..900&family=Schibsted+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&family=Unbounded:wght@500;600&family=Figtree:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=Public+Sans:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============ galerii raam ============ */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #E7E6E2; color: #1A1A1A; font-family: "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .intro { max-width: 1180px; margin: 0 auto; padding: 56px 24px 8px; }
    .intro h1 { font: 600 30px/1.1 "Instrument Sans", sans-serif; letter-spacing: -.02em; margin: 0 0 12px; }
    .intro p { max-width: 62ch; color: #555; margin: 0 0 18px; font-size: 15px; line-height: 1.5; }
    .toc { display: flex; flex-wrap: wrap; gap: 6px; }
    .toc a { font-size: 12.5px; font-weight: 600; color: #1A1A1A; text-decoration: none; background: #fff; border: 1px solid rgba(0,0,0,.1); border-radius: 8px; padding: 6px 10px; }
    .toc a:hover { border-color: #1A1A1A; }
    .variant { max-width: 1180px; margin: 44px auto 76px; padding: 0 24px; scroll-margin-top: 24px; }
    .cap { display: flex; gap: 16px; align-items: flex-start; margin: 0 0 14px; }
    .cap-n { width: 30px; height: 30px; border-radius: 50%; background: #1A1A1A; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
    .cap-t b { font-size: 18px; letter-spacing: -.01em; }
    .cap-t span { display: block; color: #555; font-size: 13.5px; margin-top: 3px; max-width: 60ch; line-height: 1.45; }
    .cap-meta { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 400px; font-size: 12px; color: #555; }
    .cap-meta .sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); }
    .cap-meta .m { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 6px; padding: 3px 8px; }

    /* ============ ühine ekraaniskelett (tokenid tulevad .vN pealt) ============ */
    .scr { display: grid; grid-template-columns: 224px 1fr; height: 680px; overflow: hidden; border-radius: 16px; position: relative;
      background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 14px; line-height: 1.45;
      box-shadow: 0 40px 90px -46px rgba(0,0,0,.45); border: 1px solid rgba(0,0,0,.07); }
    .sb { background: var(--sb, var(--sf)); border-right: 1px solid var(--line); padding: 18px 14px 16px; display: flex; flex-direction: column; min-width: 0; }
    .logo { font-family: var(--fd); font-weight: 700; font-size: 17px; letter-spacing: -.01em; padding: 4px 8px 22px; color: var(--ink); white-space: nowrap; }
    .logo span { font-weight: 400; color: var(--mute); }
    .sb nav { display: flex; flex-direction: column; gap: 4px; }
    .sb nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 500; color: var(--ink2); position: relative; cursor: pointer; }
    .sb nav a.on { background: var(--acc); color: var(--acc-ink); }
    .sb nav a i, .qa a i, .it i, .st-h i, .srch i, .comp-row i, .send i { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
    svg.ic { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    svg.ic.solid { fill: currentColor; stroke: none; }
    .sb-foot { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 8px; }
    .av { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
    .sb-foot b { display: block; font-size: 12.5px; }
    .sb-foot small { color: var(--mute); font-size: 11px; }
    .mn { display: flex; flex-direction: column; min-width: 0; position: relative; }
    .hd { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--hd, transparent); flex: none; }
    .srch { flex: 1; max-width: 400px; display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--sf2); color: var(--mute); font-size: 13px; }
    .srch i { width: 15px; height: 15px; }
    .srch kbd { margin-left: auto; font: 500 10.5px var(--fm, var(--fb)); color: var(--mute); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
    .new { margin-left: auto; background: var(--ink); color: var(--bg); border: none; border-radius: var(--r-sm); padding: 8px 14px; font: 600 13px var(--fb); cursor: pointer; }
    .hero { padding: 40px 40px 28px; max-width: 780px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; text-align: var(--al, center); }
    .hi { color: var(--mute); font-size: 14px; }
    .q { font: var(--qw, 600) var(--qs, 40px)/1.06 var(--fd); letter-spacing: var(--qls, -.025em); margin: 8px 0 24px; color: var(--ink); }
    .comp { background: var(--sf); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 12px; box-shadow: var(--comp-sh, none); text-align: left; }
    .comp-in { color: var(--mute); font-size: 15px; padding: 2px 2px 20px; }
    .comp-row { display: flex; align-items: center; gap: 8px; }
    .chip { background: var(--sf2); color: var(--ink2); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; }
    .grow { flex: 1; }
    .comp-row i { color: var(--mute); width: 16px; height: 16px; }
    .send { width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); border: none; display: grid; place-items: center; cursor: pointer; margin-left: 4px; flex: none; }
    .send i { width: 16px; height: 16px; color: inherit; }
    .qa { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 24px; justify-content: var(--qa-j, center); }
    .qa a { display: inline-flex; align-items: center; gap: 8px; background: var(--sf); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 13px; font-size: 12.5px; font-weight: 600; color: var(--ink2); cursor: pointer; }
    .qa a i { width: 15px; height: 15px; color: var(--acc); }
    .stacks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: auto; text-align: left; }
    .stack { background: var(--sf2); border-radius: var(--r); padding: 12px; }
    .st-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 2px 4px 10px; }
    .st-h i { width: 15px; height: 15px; color: var(--mute); }
    .st-h b { margin-left: auto; background: var(--ink); color: var(--bg); border-radius: 999px; font-size: 10.5px; padding: 1px 7px; font-family: var(--fm, var(--fb)); }
    .it { display: flex; align-items: center; gap: 10px; background: var(--sf); border-radius: var(--r-sm); padding: 9px 11px; font-size: 12.5px; }
    .it + .it { margin-top: 6px; }
    .it i { width: 15px; height: 15px; color: var(--acc); }
    .it > div { min-width: 0; flex: 1; }
    .it b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .it small { display: block; color: var(--mute); font-size: 11px; font-family: var(--fm, var(--fb)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { font-size: 11px; font-weight: 600; color: var(--acc); white-space: nowrap; font-family: var(--fm, var(--fb)); }
    @media (max-width: 900px) { .scr { grid-template-columns: 1fr; height: auto; } .sb { display: none; } .stacks { grid-template-columns: 1fr; } .cap-meta { margin-left: 0; justify-content: flex-start; } }

    /* ============ 1 · Kirjapress — toimetuslik serif, oksveri ============ */
    .v1 { --bg: #F4F2EC; --sf: #FBFAF7; --sf2: #ECE9E1; --ink: #1C1A17; --ink2: #3A3733; --mute: #7A756C; --line: #D9D5CB;
      --acc: #7A1F1F; --acc-ink: #FBF7F2; --fd: "Fraunces", serif; --fb: "IBM Plex Sans", sans-serif;
      --r: 4px; --r-sm: 3px; --qs: 48px; --qw: 500; --qls: -.012em; --al: left; --qa-j: flex-start; }
    .v1 .hero { margin: 0; max-width: 860px; padding-top: 48px; }
    .v1 .hi { font-family: var(--fd); font-style: italic; font-size: 17px; color: var(--ink2); }
    .v1 .q { line-height: 1.02; margin-bottom: 30px; }
    .v1 .q .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; margin-right: .22em; }
    .v1 .q .w span { display: inline-block; transform: translateY(112%); }
    .v1.in .q .w span { animation: v1rise .75s cubic-bezier(.2,.7,.2,1) forwards; }
    .v1.in .q .w:nth-child(2) span { animation-delay: .08s; } .v1.in .q .w:nth-child(3) span { animation-delay: .16s; } .v1.in .q .w:nth-child(4) span { animation-delay: .24s; }
    @keyframes v1rise { to { transform: translateY(0); } }
    .v1 .sb nav { gap: 0; }
    .v1 .sb nav a { border-radius: 0; border-bottom: 1px solid var(--line); padding: 11px 10px; }
    .v1 .sb nav a.on { background: none; color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--acc); }
    .v1 .sb nav a.on i { color: var(--acc); }
    .v1 svg.ic { stroke-width: 1.25; }
    .v1 .comp { background: none; border: none; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); border-radius: 0; padding: 16px 0 12px; transform: scaleX(0); transform-origin: left; }
    .v1.in .comp { animation: v1rule .6s .35s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes v1rule { to { transform: scaleX(1); } }
    .v1 .comp-in { font-family: var(--fd); font-style: italic; font-size: 18px; }
    .v1 .chip { border-radius: 2px; background: none; border: 1px solid var(--line); }
    .v1 .send { border-radius: 2px; }
    .v1 .new { border-radius: 2px; background: var(--acc); color: var(--acc-ink); }
    .v1 .srch { background: none; border-bottom: 1px solid var(--line); border-radius: 0; padding-left: 0; }
    .v1 .qa a { background: none; border: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 2px; margin-right: 18px; }
    .v1 .stack { background: none; border-top: 1px solid var(--ink); border-radius: 0; padding: 10px 0 0; }
    .v1 .it { background: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 2px; }
    .v1 .it + .it { margin-top: 0; }
    .v1 .st-h b { background: none; color: var(--acc); font-family: var(--fd); font-size: 14px; }

    /* ============ 2 · Metsaserv — tume kuusk, messing ============ */
    .v2 { --bg: #0F1A14; --sf: #172620; --sf2: #1E3028; --ink: #EAF1EC; --ink2: #C9D6CE; --mute: #7F9488; --line: #26382F;
      --acc: #D8A657; --acc-ink: #1A1509; --acc2: #9DBF9E; --fd: "Manrope", sans-serif; --fb: "Manrope", sans-serif;
      --r: 16px; --r-sm: 12px; --qs: 40px; --qw: 800; --qls: -.03em; --comp-sh: 0 30px 60px -30px rgba(0,0,0,.7); }
    .v2 .hero { position: relative; }
    .v2 .hero::before { content: ""; position: absolute; left: -80px; right: -80px; top: -40px; height: 440px; pointer-events: none; filter: blur(34px); z-index: 0;
      background: radial-gradient(520px 260px at 30% 25%, rgba(157,191,158,.22), transparent 62%), radial-gradient(440px 240px at 74% 45%, rgba(216,166,87,.2), transparent 62%); }
    .v2.in .hero::before { animation: v2aur 14s ease-in-out infinite alternate; }
    @keyframes v2aur { to { transform: translate(70px, 36px) scale(1.18); } }
    .v2 .hero > * { position: relative; z-index: 1; }
    .v2 svg.ic { stroke-width: 2.2; }
    .v2 .sb nav a i { width: 30px; height: 30px; border-radius: 50%; background: rgba(216,166,87,.12); color: var(--acc); }
    .v2 .sb nav a.on { background: var(--sf2); color: var(--ink); }
    .v2 .sb nav a.on i { background: var(--acc); color: var(--acc-ink); }
    .v2 .logo { color: var(--acc); }
    .v2 .new { background: var(--acc); color: var(--acc-ink); border-radius: 999px; }
    .v2 .comp { transition: border-color .25s, box-shadow .25s; }
    .v2 .comp:hover { border-color: rgba(216,166,87,.55); box-shadow: 0 30px 60px -30px rgba(0,0,0,.7), 0 0 0 4px rgba(216,166,87,.08); }
    .v2 .qa a { border-radius: 999px; }
    .v2 .qa a i, .v2 .it i { color: var(--acc2); }
    .v2 .st-h b { background: var(--acc); color: var(--acc-ink); }
    .v2 .pill { color: var(--acc); }
    .v2 .av { background: var(--acc); color: var(--acc-ink); }

    /* ============ 3 · Kontor 1978 — retro Bauhaus, punane · sinep · koobalt ============ */
    .v3 { --bg: #F1E4CC; --sf: #FBF3E3; --sf2: #E9D9BC; --ink: #221F1C; --ink2: #3E3934; --mute: #8A7F70; --line: #221F1C;
      --acc: #D8412E; --acc-ink: #FFF6EA; --acc2: #E8B830; --acc3: #2C4FA3; --fd: "Archivo", sans-serif; --fb: "Archivo", sans-serif;
      --r: 0; --r-sm: 0; --qs: 50px; --qw: 900; --qls: -.02em; --al: left; --qa-j: flex-start; }
    .v3 .q { font-variation-settings: "wdth" 118; text-transform: uppercase; line-height: .98; text-shadow: 0 0 0 var(--acc2); }
    .v3.in .q { animation: v3print .5s .2s steps(4) forwards; }
    @keyframes v3print { to { text-shadow: 5px 5px 0 var(--acc2); } }
    .v3 .logo { font-weight: 900; font-variation-settings: "wdth" 120; letter-spacing: .02em; }
    .v3 .sb { border-right: 2px solid var(--ink); }
    .v3 .hd { border-bottom: 2px solid var(--ink); }
    .v3 .sb nav a { text-transform: uppercase; font-size: 12px; letter-spacing: .04em; font-weight: 700; }
    .v3 .sb nav a.on { box-shadow: 4px 4px 0 var(--ink); }
    .v3 svg.ic.solid { stroke: none; }
    .v3 .comp { border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
    .v3 .chip { border-radius: 0; background: var(--acc3); color: #fff; }
    .v3 .send { border-radius: 0; background: var(--acc2); color: var(--ink); }
    .v3 .new { background: var(--acc); color: var(--acc-ink); box-shadow: 3px 3px 0 var(--ink); }
    .v3 .srch { border: 2px solid var(--ink); background: var(--sf); color: var(--ink2); }
    .v3 .qa { gap: 10px; }
    .v3 .qa a { color: #fff; border: none; padding: 10px 14px; text-transform: uppercase; font-size: 11.5px; letter-spacing: .04em; opacity: 0; transform: translateX(-28px); }
    .v3 .qa a i { color: #fff; }
    .v3 .qa a:nth-child(1) { background: var(--acc); } .v3 .qa a:nth-child(2) { background: var(--acc3); }
    .v3 .qa a:nth-child(3) { background: var(--acc2); color: var(--ink); } .v3 .qa a:nth-child(3) i { color: var(--ink); }
    .v3 .qa a:nth-child(4) { background: var(--ink); color: var(--sf); }
    .v3.in .qa a { animation: v3slide .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .v3.in .qa a:nth-child(2) { animation-delay: .08s; } .v3.in .qa a:nth-child(3) { animation-delay: .16s; } .v3.in .qa a:nth-child(4) { animation-delay: .24s; }
    @keyframes v3slide { to { opacity: 1; transform: none; } }
    .v3 .stack { background: var(--sf); border: 2px solid var(--ink); }
    .v3 .it { background: var(--sf2); }
    .v3 .it i { color: var(--acc3); }
    .v3 .st-h b { background: var(--acc); color: var(--acc-ink); border-radius: 0; }
    .v3 .pill { color: var(--acc); text-transform: uppercase; }

    /* ============ 4 · Laboratoorium — valge võrk, teal, mono-andmed ============ */
    .v4 { --bg: #FFFFFF; --sf: #FFFFFF; --sf2: #F3F5F5; --ink: #101214; --ink2: #2E3338; --mute: #7A838A; --line: #D5DADD;
      --acc: #0F9B8E; --acc-ink: #FFFFFF; --fd: "Schibsted Grotesk", sans-serif; --fb: "Schibsted Grotesk", sans-serif; --fm: "Geist Mono", monospace;
      --r: 6px; --r-sm: 4px; --qs: 38px; --qw: 600; --qls: -.02em; --al: left; --qa-j: flex-start; }
    .v4 .mn { background-image: linear-gradient(#EEF1F1 1px, transparent 1px), linear-gradient(90deg, #EEF1F1 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
    .v4 .hd { background: #fff; }
    .v4 svg.ic { stroke-width: 1.5; stroke-linecap: butt; stroke-linejoin: miter; }
    .v4 .sb nav a i, .v4 .qa a i { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
    .v4 .sb nav a.on { background: none; color: var(--acc); }
    .v4 .sb nav a.on::after { content: ""; position: absolute; right: -14px; top: 6px; bottom: 6px; width: 2px; background: var(--acc); }
    .v4 .sb nav a.on i { border-color: var(--acc); color: var(--acc); }
    .v4 .logo { font-family: var(--fm); font-weight: 500; letter-spacing: .02em; }
    .v4 .comp { box-shadow: 0 1px 0 var(--line); }
    .v4 .comp-in { font-family: var(--fm); font-size: 13.5px; }
    .v4 .comp-in::after { content: ""; display: inline-block; width: 8px; height: 15px; background: var(--acc); margin-left: 5px; vertical-align: -2px; animation: v4blink 1s steps(1) infinite; }
    @keyframes v4blink { 50% { opacity: 0; } }
    .v4 .chip { border-radius: 3px; font-family: var(--fm); font-weight: 500; }
    .v4 .send { border-radius: 4px; }
    .v4 .qa a { background: #fff; }
    .v4 .qa a i { color: var(--ink); }
    .v4 .qa svg.ic path, .v4 .qa svg.ic rect, .v4 .qa svg.ic circle { stroke-dasharray: 70; stroke-dashoffset: 70; }
    .v4.in .qa svg.ic path, .v4.in .qa svg.ic rect, .v4.in .qa svg.ic circle { animation: v4draw 1.1s ease forwards; }
    .v4.in .qa a:nth-child(2) svg.ic * { animation-delay: .15s; } .v4.in .qa a:nth-child(3) svg.ic * { animation-delay: .3s; } .v4.in .qa a:nth-child(4) svg.ic * { animation-delay: .45s; }
    @keyframes v4draw { to { stroke-dashoffset: 0; } }
    .v4 .stack { background: #fff; border: 1px solid var(--line); }
    .v4 .it { background: var(--sf2); }
    .v4 .st-h b { border-radius: 3px; }
    .v4 .hi, .v4 .it small { font-family: var(--fm); font-size: 12px; }

    /* ============ 5 · Oliiv — kahvatu oliiv, Instrument Serif, kahetooniikoonid ============ */
    .v5 { --bg: #F2F3EA; --sf: #FAFBF5; --sf2: #E8EADB; --ink: #23271B; --ink2: #3F4433; --mute: #7D8470; --line: #D8DCC8;
      --acc: #6B7A2A; --acc-ink: #F7F8EE; --acc2: #C9A227; --fd: "Instrument Serif", serif; --fb: "Instrument Sans", sans-serif;
      --r: 22px; --r-sm: 12px; --qs: 50px; --qw: 400; --qls: -.01em; }
    .v5 .q { min-height: 1.06em; }
    .v5 .q .caret { display: inline-block; width: 2px; height: .9em; background: var(--acc); vertical-align: -.08em; margin-left: 3px; animation: v4blink 1s steps(1) infinite; }
    .v5 .hi { font-family: var(--fd); font-style: italic; font-size: 18px; }
    .v5 svg.ic { stroke-width: 1.5; }
    .v5 svg.ic.duo { fill: rgba(107,122,42,.18); }
    .v5 .sb nav a i { width: 28px; height: 28px; border-radius: 8px; background: var(--sf2); color: var(--acc); }
    .v5 .sb nav a.on { background: var(--sf); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
    .v5 .sb nav a.on i { background: var(--acc); color: var(--acc-ink); }
    .v5 .sb nav a.on svg.ic.duo { fill: rgba(255,255,255,.25); }
    .v5 .comp { border-radius: 26px; padding: 18px 18px 12px; opacity: 0; transform: translateY(8px); }
    .v5.in .comp { animation: v5in .6s 1.9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes v5in { to { opacity: 1; transform: none; } }

      { n: 4, name: "Laboratoorium", desc: "Täpne: 24px võrk lõuendil, ruudukujulised ikoonitiilid, mono-andmed, teal-kursor vilgub. Kiirtegevuste ikoonid joonistuvad sisse.",
        sw: ["#FFFFFF", "#101214", "#0F9B8E"], fonts: "Schibsted Grotesk + Geist Mono", icons: "kandiline 1.5, ruuttiilid", motion: "ikoonid joonistuvad, kursor vilgub", style: "line" },
      { n: 5, name: "Oliiv", desc: "Kahvatu oliiv ja Instrument Serif: küsimus kirjutab ennast tähthaaval, siis ilmub komposer. Ikoonid kahetoonilised (hele täide + joon).",
        sw: ["#F2F3EA", "#6B7A2A", "#C9A227"], fonts: "Instrument Serif + Instrument Sans", icons: "kahetooniline 1.5", motion: "kirjutusmasin, komposer järel", style: "duo" },
      { n: 6, name: "Öölamp", desc: "Süsi ja merevaigulamp: valguslaik järgneb kursorile üle kogu sisuala, komposer süttib hoveril. DM Serif küsimus, täidetud ikoonid tiilides.",
        sw: ["#1A1917", "#F2B441", "#F3EFE8"], fonts: "DM Serif Display + DM Sans", icons: "täidetud, merevaigutiilid", motion: "kursorile järgnev valgus", style: "solid" },
      { n: 7, name: "Signaal", desc: "Šveitsi must-valge, 2px jooned, Unbounded. Üks värv: markerkollane, mis pühib aktiivse navi ja küsimuse alla nagu esiletõstja.",
        sw: ["#FFFFFF", "#000000", "#FFD400"], fonts: "Unbounded + Figtree", icons: "paks 2.5, ilma tiilideta", motion: "marker pühib", style: "line" },
      { n: 8, name: "Piparmünt", desc: "Mündivalge ja smaragd, Sora. Kiirtegevused on magnetilised (nihkuvad kursori poole), virnad laotuvad hoveril lehvikuna laiali.",
        sw: ["#EAF4EF", "#0B6E4F", "#FFFFFF"], fonts: "Sora", icons: "täidetud, valged tiilid", motion: "magnetnupud, lehvik", style: "solid" },
      { n: 9, name: "Tint", desc: "Must-valge tušš, Literata. Värvi pole — ainult üks punane pitsat (saatmisnupp), mis vajutub hoveril. Küsimus valgub tindina teravaks.",
        sw: ["#F7F7F5", "#0A0A0A", "#E34234"], fonts: "Literata + Public Sans", icons: "õhuke 1.2, ilma tiilideta", motion: "tindivalgumine, pitsat", style: "line" },
      { n: 10, name: "Pastell", desc: "Pehmed värviplokid, Outfit. Iga navi-ikoon ja kiirtegevus oma pastelltoonil; nupud põrkavad sisse ja vibavad hoveril. Virnad virsiku ja mündi peal.",
        sw: ["#FBF7F0", "#FFE68A", "#FFC9A8", "#BDEBD5", "#C6DDF5", "#E8793F"], fonts: "Outfit", icons: "täidetud, pastelltiilid", motion: "põrkav sisenemine, vibin", style: "solid" },
    ];

    const NAV = [["home", "Avaleht"], ["grid", "Ülevaade"], ["bld", "Portfell"], ["cal", "Kalender"], ["chat", "Suhtlus"]];
    const QA = [["doc", "Loo pakkumine"], ["ask", "Küsi portfelli kohta"], ["shield", "Riskiraport"], ["imp", "Impordi leping"]];
    const ACTS = [["edit", "Roheline Ladu OÜ — ettepanek ootab vastust", "PAK-2026-009 · pakkumus", "vasta"],
                  ["doc", "Future Invest OÜ — mustand valmis saatmiseks", "PAK-2026-014 · pakkumus", "saada"],
                  ["chat", "Estplast OÜ — küsimus punktis 4.2", "LEP-2025-014 · leping", "vasta"]];
    const KEYS = [["file", "Pakkumuse kehtivus", "PAK-2026-011 · Mikrotehnika AS", "16.06"],
                  ["cal", "Üüri indekseerimine", "LEP-2024-022 · Käsitöö Koda", "01.07"],
                  ["cal", "Tagatisraha tähtaeg", "LEP-2025-014 · Estplast", "15.07"]];

    function screen(v) {
      const s = v.style;
      const q = v.n === 1
        ? "Millega saan täna aidata?".split(" ").map(w => `<span class="w"><span>${w}</span></span>`).join("")
        : v.n === 5 ? `<span class="tw"></span><span class="caret"></span>` : "Millega saan täna aidata?";
      return `
      <section class="variant v${v.n}" id="v${v.n}">
        <div class="cap">
          <div class="cap-n">${v.n}</div>
          <div class="cap-t"><b>${v.name}</b><span>${v.desc}</span></div>
          <div class="cap-meta">${v.sw.map(c => `<span class="sw" style="background:${c}"></span>`).join("")}<span class="m">${v.fonts}</span><span class="m">${v.icons}</span><span class="m">${v.motion}</span></div>
        </div>
        <div class="scr">
          <aside class="sb">
            <div class="logo">THINK<span>ONE</span></div>
            <nav>${NAV.map(([k, t], i) => `<a class="${i === 0 ? "on" : ""}"><i>${ic(k, s)}</i><span>${t}</span></a>`).join("")}</nav>
            <div class="sb-foot"><div class="av">TS</div><div><b>Tarmo Sepp</b><small>Operaator</small></div></div>
          </aside>
          <div class="mn">
            <div class="hd"><div class="srch"><i>${ic("search", s === "duo" ? "line" : s)}</i>Otsi või küsi… lepingud, kliendid, pinnad<kbd>⌘K</kbd></div><button class="new">+ Uus</button></div>
            <div class="hero">
              <div class="hi">Tere, Tarmo.</div>
              <h1 class="q">${q}</h1>
              <div class="comp">
                <div class="comp-in">Küsi, otsi või anna korraldus — agent aitab</div>
                <div class="comp-row"><span class="chip">Kiire vastus ⌄</span><span class="grow"></span><i>${ic("clip", "line")}</i><i>${ic("mic", s === "duo" ? "line" : s)}</i><button class="send"><i>${ic("send", s === "duo" ? "line" : s)}</i></button></div>
              </div>
              <div class="qa">${QA.map(([k, t]) => `<a><i>${ic(k, s)}</i>${t}</a>`).join("")}</div>
              <div class="stacks">
                <div class="stack"><div class="st-h"><i>${ic("bell", s === "duo" ? "line" : s)}</i>Vajab tegevust<b>3</b></div>
                  ${ACTS.map(([k, t, sub, p]) => `<div class="it"><i>${ic(k, s)}</i><div><b>${t}</b><small>${sub}</small></div><span class="pill">${p}</span></div>`).join("")}</div>
                <div class="stack"><div class="st-h"><i>${ic("cal", s === "duo" ? "line" : s)}</i>Võtmekuupäevad<b>5</b></div>
                  ${KEYS.map(([k, t, sub, d]) => `<div class="it"><i>${ic(k, s)}</i><div><b>${t}</b><small>${sub}</small></div><span class="pill">${d}</span></div>`).join("")}</div>
              </div>
            </div>
          </div>
        </div>
      </section>`;
    }

    document.getElementById("gallery").innerHTML = V.map(screen).join("");
    document.getElementById("toc").innerHTML = V.map(v => `<a href="#v${v.n}">${v.n} · ${v.name}</a>`).join("");

    /* ---------- liikumine: käivitub, kui ekraan vaatesse jõuab (üks kord) ---------- */
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target; el.classList.add("in"); io.unobserve(el);
      if (el.classList.contains("v5")) typewrite(el);
    }), { threshold: .4 });
    document.querySelectorAll(".variant").forEach(el => io.observe(el));

    /* 5 · kirjutusmasin */
    function typewrite(el) {
      const tw = el.querySelector(".tw"), text = "Millega saan täna aidata?";
      if (reduce) { tw.textContent = text; return; }
      let i = 0; const tick = () => { tw.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(tick, 42 + Math.random() * 50); };
      setTimeout(tick, 300);
    }
    /* 6 · kursorile järgnev valgus */
    const v6 = document.querySelector(".v6 .scr");
    v6.addEventListener("mousemove", e => { const r = v6.getBoundingClientRect(); v6.style.setProperty("--mx", (e.clientX - r.left - 224) + "px"); v6.style.setProperty("--my", (e.clientY - r.top) + "px"); });
    v6.addEventListener("mouseleave", () => { v6.style.setProperty("--mx", "50%"); v6.style.setProperty("--my", "38%"); });
    /* 8 · magnetnupud */
    if (!reduce) document.querySelectorAll(".v8 .qa a").forEach(a => {
      a.addEventListener("mousemove", e => { const r = a.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); a.style.transform = `translate(${dx * .18}px, ${dy * .3}px)`; });
      a.addEventListener("mouseleave", () => { a.style.transform = ""; });
    });
  </script>
</body>
</html>
