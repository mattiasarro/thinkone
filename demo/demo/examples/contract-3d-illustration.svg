<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eaf4"/>
    </linearGradient>
    <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3fa"/>
      <stop offset="1" stop-color="#d4dae9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c2d8"/>
      <stop offset="1" stop-color="#d7ddea"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f7dff"/>
      <stop offset="1" stop-color="#3c4fe0"/>
    </linearGradient>
    <linearGradient id="accentDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4fe0"/>
      <stop offset="1" stop-color="#2a3bb8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd68f"/>
      <stop offset="1" stop-color="#1fa866"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="0.45" stop-color="#4a5070"/>
      <stop offset="1" stop-color="#22253a"/>
    </linearGradient>
    <linearGradient id="penGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b84a"/>
      <stop offset="0.5" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c9932a"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#e0453a"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="600" height="600" rx="40" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="210" fill="#ffffff" opacity="0.35"/>

  <!-- ground shadow -->
  <ellipse cx="300" cy="500" rx="150" ry="26" fill="#3b4aa6" opacity="0.28" filter="url(#softShadow)"/>

  <!-- document stack, slight oblique tilt for 3D feel -->
  <g transform="translate(300 300) skewY(-8) translate(-300 -300)">

    <!-- back page 2 -->
    <g transform="translate(22 -26)">
      <rect x="190" y="150" width="220" height="300" rx="18" fill="url(#paperBack)"/>
      <rect x="404" y="156" width="8" height="294" rx="4" fill="url(#edge)"/>
    </g>

    <!-- back page 1 -->
    <g transform="translate(11 -13)">
      <rect x="190" y="150" width="220" height="300" rx="18" fill="url(#paperBack)"/>
      <rect x="404" y="156" width="8" height="294" rx="4" fill="url(#edge)"/>
    </g>

    <!-- front page -->
    <g>
      <!-- thickness edge -->
      <rect x="196" y="450" width="214" height="10" rx="5" fill="#b9c2d8"/>
      <rect x="404" y="156" width="10" height="298" rx="5" fill="url(#edge)"/>
      <!-- face -->
      <rect x="190" y="150" width="220" height="300" rx="18" fill="url(#paper)"/>

      <!-- header band -->
      <path d="M190 168 a18 18 0 0 1 18 -18 h184 a18 18 0 0 1 18 18 v34 h-220 z" fill="url(#accent)"/>
      <rect x="208" y="166" width="70" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
      <rect x="208" y="182" width="42" height="7" rx="3.5" fill="#ffffff" opacity="0.6"/>

      <!-- text lines -->
      <g fill="#c5ccdf">
        <rect x="210" y="222" width="180" height="9" rx="4.5"/>
        <rect x="210" y="240" width="160" height="9" rx="4.5"/>
        <rect x="210" y="258" width="176" height="9" rx="4.5"/>
        <rect x="210" y="276" width="120" height="9" rx="4.5"/>
        <rect x="210" y="304" width="180" height="9" rx="4.5"/>
        <rect x="210" y="322" width="150" height="9" rx="4.5"/>
        <rect x="210" y="340" width="168" height="9" rx="4.5"/>
      </g>

      <!-- signature line + signature -->
      <rect x="210" y="416" width="110" height="3" rx="1.5" fill="#aeb7cf"/>
      <path d="M214 410 c8 -22 16 -24 20 -8 c3 12 8 12 14 -4 c5 -14 10 -12 12 2 c2 12 8 10 14 -2 c6 -12 12 -8 14 4 c2 10 8 10 16 0"
            fill="none" stroke="#2f3a86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- seal -->
      <g transform="translate(362 400)">
        <circle r="24" fill="url(#seal)"/>
        <circle r="17" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" stroke-dasharray="4 4"/>
        <path d="M-7 1 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- pen -->
  <g transform="translate(415 330) rotate(38)">
    <ellipse cx="0" cy="170" rx="22" ry="8" fill="#2a3bb8" opacity="0.25" filter="url(#smallShadow)"/>
    <rect x="-13" y="-120" width="26" height="240" rx="13" fill="url(#penBody)"/>
    <rect x="-13" y="-120" width="26" height="60" rx="13" fill="#3a4062"/>
    <rect x="-13" y="-62" width="26" height="8" fill="url(#penGold)"/>
    <rect x="6" y="-110" width="5" height="46" rx="2.5" fill="url(#penGold)"/>
    <path d="M-13 120 l13 40 l13 -40 z" fill="url(#penGold)"/>
    <path d="M-4 150 l4 12 l4 -12 z" fill="#1b1e2e"/>
    <rect x="-9" y="-40" width="5" height="130" rx="2.5" fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- floating check badge -->
  <g transform="translate(160 190)">
    <ellipse cx="0" cy="62" rx="40" ry="10" fill="#1fa866" opacity="0.28" filter="url(#smallShadow)"/>
    <circle cy="6" r="46" fill="#178f55"/>
    <circle r="46" fill="url(#badge)"/>
    <circle r="34" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
    <path d="M-18 2 l12 12 l24 -26" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating coins / accents -->
  <g transform="translate(470 150)">
    <circle cy="5" r="22" fill="#2a3bb8"/>
    <circle r="22" fill="url(#accent)"/>
    <circle r="13" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M120 320 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z" opacity="0.9"/>
    <path d="M470 430 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z" opacity="0.8"/>
    <circle cx="150" cy="420" r="5" opacity="0.8"/>
    <circle cx="500" cy="250" r="4" opacity="0.7"/>
  </g>
</svg>
